name: Daily Pop-Up Refresh

on:
  schedule:
    # 00:30 UTC = 6:00 AM IST
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline.py

      - name: Commit today's data
        run: |
          git config user.name "popup-bot"
          git config user.email "bot@popup.local"
          git add data/latest.json data/draft.json
          git commit -m "Daily auto-publish $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
          # No deploy-hook step needed here - Streamlit Community Cloud
          # auto-redeploys on every push to the connected branch.
